---
- name: Configure Ansible Controller
  hosts: ansible_controller
  become: yes
  tasks:
    - name: Install Python3 and pip
      yum:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install Ansible
      pip:
        name: ansible
        executable: pip3

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Create Ansible directory
      file:
        path: /etc/ansible
        state: directory
