---
- name: Configure Jenkins Agents
  hosts: jenkins_agents
  become: yes
  tasks:
    - name: Install Java
      yum:
        name: java-17-amazon-corretto
        state: present

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Create Jenkins agent directory
      file:
        path: /home/ec2-user/jenkins-agent
        state: directory
        owner: ec2-user
        group: ec2-user
